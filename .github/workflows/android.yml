name: Build Daily Streak APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q Daily-Streak-2.0.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cp -a "$PROJECT_DIR"/. .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: daily-streak-apk
          path: app/build/outputs/apk/debug/app-debug.apk
